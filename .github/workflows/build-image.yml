name: build-image

on:
  push:
    branches: [main]
    paths:
      - 'Roll-and-Move/**'
      - 'SignalingServer/**'
      - '.dockerignore'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Roll-and-Move/package-lock.json

      - name: Build the game
        working-directory: Roll-and-Move
        run: |
          npm ci
          npm run build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: SignalingServer/Dockerfile
          push: true
          tags: |
            ghcr.io/mooling0602/paper-cloud-games:latest
            ghcr.io/mooling0602/paper-cloud-games:${{ github.sha }}
