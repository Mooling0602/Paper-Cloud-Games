<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roll-and-Move</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=LXGW+WenKai&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f6f1e5;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app canvas {
        touch-action: none; /* keep multi-touch gestures for the game */
      }
      .blocked {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: 'LXGW WenKai', 'Patrick Hand', 'KaiTi', cursive;
        color: #3b372e;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .blocked h1 {
        font-size: 36px;
        margin: 0;
        color: #c94f4f;
      }
      .blocked p {
        font-size: 20px;
        margin: 0;
        max-width: 520px;
        line-height: 1.7;
      }
      .blocked .dim {
        font-size: 16px;
        color: #8a8374;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
